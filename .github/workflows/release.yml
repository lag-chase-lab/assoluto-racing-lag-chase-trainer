name: Release package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build cross-platform zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          package="assoluto-racing-lag-chase-trainer-${GITHUB_REF_NAME}"
          git archive \
            --format=zip \
            --prefix="${package}/" \
            HEAD \
            --output="dist/${package}.zip"
          cd dist
          sha256sum "${package}.zip" > "${package}.zip.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip \
            dist/*.sha256 \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
